<!doctype html>
<html lang="id" data-theme="liquid-dark" data-mode="dark" data-glass="liquid">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15161c">
<meta name="description" content="Amatu Draw — aplikasi desain grafis vektor ala CorelDRAW di peramban: Pembentukan, PowerClip, efek langsung, PowerTRACE, teks ke kurva, multi-halaman, ekspor SVG/PNG/PDF.">
<title>Amatu Draw — Desain Grafis Vektor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='a' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232ee6a6'/%3E%3Cstop offset='.55' stop-color='%2319a8d8'/%3E%3Cstop offset='1' stop-color='%236d5cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='3' y='3' width='58' height='58' rx='16' fill='url(%23a)'/%3E%3Cpath d='M14 46C20 22 36 16 50 18' fill='none' stroke='%23fff' stroke-width='4.4' stroke-linecap='round'/%3E%3Crect x='11' y='43' width='7' height='7' rx='1.6' fill='%23fff'/%3E%3Ccircle cx='50' cy='18' r='3.6' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="starting">
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div id="app">
  <header id="menubar" class="bar glass refract"></header>
  <div id="stdbar" class="bar glass"></div>
  <div id="propbar" class="bar glass"></div>
  <div id="doctabs"></div>
  <div id="work">
    <aside id="toolbox" class="glass refract" aria-label="Kotak alat"></aside>
    <section id="stage">
      <div id="rcorner" title="Dobel klik: pengaturan penggaris"></div>
      <canvas id="rulerH"></canvas>
      <canvas id="rulerV"></canvas>
      <div id="viewport">
        <svg id="cv" xmlns="http://www.w3.org/2000/svg"></svg>
        <svg id="ov" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="textedit"></div>
      </div>
      <div id="pagebar"></div>
    </section>
    <div id="dockwrap">
      <aside id="dockers" class="glass refract" aria-label="Docker"></aside>
      <nav id="docktabs" class="glass"></nav>
    </div>
    <aside id="palette" class="glass refract" aria-label="Palet warna"></aside>
  </div>
  <div id="docpal" class="glass"></div>
  <footer id="status" class="glass"></footer>
  <div id="startpage" hidden></div>
</div>
<div id="boot"><div class="bootlogo"></div><span>Memuat Amatu Draw…</span></div>
<noscript><p style="padding:40px;font:16px system-ui">Amatu Draw memerlukan JavaScript.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
